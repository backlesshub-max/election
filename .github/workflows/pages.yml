# RCSU Election | Maintainer: Reinhardson Sangma
name: Deploy RCSU Election Portal

on:
  push:
    branches: [main]
    paths:
      - 'rcsu-election-source.zip'
      - 'config.js'
      - 'SETUP.md'
      - 'supabase/**'
      - 'assets/**'
      - 'index.html'
      - 'tools/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Refresh source archive and publish editable source files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -s rcsu-election-source.zip
          test -s config.js
          test -s SETUP.md
          mkdir -p extracted site
          unzip -q rcsu-election-source.zip -d extracted
          cp config.js extracted/config.js
          cp SETUP.md extracted/SETUP.md
          mkdir -p extracted/supabase/migrations
          cp supabase/config.toml extracted/supabase/config.toml
          cp supabase/migrations/20261120125500_add_election_fk_indexes.sql extracted/supabase/migrations/
          rm -f extracted/README.md README.md
          rm -f rcsu-election-source.zip
          (cd extracted && zip -qr ../rcsu-election-source.zip .)
          cp -a extracted/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Refresh election source bundle and publish source files"
            git push origin HEAD:main
          fi
          cp index.html site/index.html
          cp config.js site/config.js
          cp -R assets site/assets
          cp .nojekyll site/.nojekyll
          echo "Published website files:"
          find site -maxdepth 3 -type f -printf '%p (%s bytes)\n' | sort
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
