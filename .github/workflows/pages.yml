# RCSU Election | Maintainer: Reinhardson Sangma
name: Deploy RCSU Election Portal

on:
  push:
    branches: [main]
    paths:
      - 'rcsu-election-source.zip'
      - 'config.js'
      - 'SETUP.md'
      - 'supabase/**'
      - 'assets/**'
      - 'index.html'
      - 'tools/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Refresh source archive and publish editable source files
        run: |
          set -euo pipefail
          test -s rcsu-election-source.zip
          test -s config.js
          test -s SETUP.md
          tmp_dir="$(mktemp -d)"
          mkdir -p site
          unzip -q rcsu-election-source.zip -d "$tmp_dir"
          cp config.js "$tmp_dir/config.js"
          cp SETUP.md "$tmp_dir/SETUP.md"
          mkdir -p "$tmp_dir/supabase/migrations"
          cp supabase/config.toml "$tmp_dir/supabase/config.toml"
          cp supabase/migrations/20261120125500_add_election_fk_indexes.sql "$tmp_dir/supabase/migrations/"
          rm -f "$tmp_dir/README.md" README.md
          rm -f rcsu-election-source.zip
          (cd "$tmp_dir" && zip -qr "$GITHUB_WORKSPACE/rcsu-election-source.zip" .)
          cp -a "$tmp_dir"/. .
          rm -rf "$tmp_dir" extracted
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Refresh election source bundle and publish source files"
            git push origin HEAD:main
          fi
          cp index.html site/index.html
          cp config.js site/config.js
          cp -R assets site/assets
          cp .nojekyll site/.nojekyll
          echo "Published website files:"
          find site -maxdepth 3 -type f -printf '%p (%s bytes)\n' | sort
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
