# RCSU Election | Maintainer: Reinhardson Sangma
name: Deploy RCSU Election Portal

on:
  push:
    branches: [main]
    paths:
      - 'rcsu-election-source.zip'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Extract application bundle
        run: |
          set -euo pipefail
          test -s rcsu-election-source.zip
          mkdir -p extracted site
          unzip -q rcsu-election-source.zip -d extracted
          test -f extracted/index.html
          test -f extracted/config.js
          test -f extracted/assets/app.js
          cp extracted/index.html extracted/config.js site/
          cp -R extracted/assets site/
          cp extracted/.nojekyll site/.nojekyll
          echo "Published website files:"
          find site -maxdepth 3 -type f -printf '%p (%s bytes)\n' | sort
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
